<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FixIt - Unstuck in 10 minutes</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#0b0f19;color:#e6e9f0;line-height:1.55}
.wrap{max-width:860px;margin:0 auto;padding:28px 20px}a{color:#7dd3fc}
.hero h1{font-size:44px;line-height:1.1;margin:24px 0 10px}.hero h1 span{color:#34d399}.sub{font-size:19px;color:#aab3c5}
.pills span{display:inline-block;border:1px solid #2a3350;border-radius:99px;padding:3px 12px;margin:4px 6px 0 0;font-size:14px;color:#c7d0e0}
.card{background:#121a2b;border:1px solid #232c45;border-radius:14px;padding:22px;margin:22px 0}
label{display:block;font-weight:600;margin:14px 0 6px}input,select,textarea{width:100%;padding:11px;border-radius:9px;border:1px solid #2a3350;background:#0b0f19;color:#e6e9f0;font:inherit}
textarea{min-height:150px;font-family:ui-monospace,Menlo,monospace;font-size:14px}
button,.btn{background:#34d399;color:#062014;border:0;border-radius:10px;padding:13px 22px;font-weight:700;font-size:16px;cursor:pointer;text-decoration:none;display:inline-block;margin-top:16px}
.warn{background:#3b2a0a;border:1px solid #a16207;color:#fde68a;padding:12px 14px;border-radius:10px}
.err{background:#3b0d12;border:1px solid #b91c1c;padding:12px;border-radius:10px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.grid .card{margin:0;text-align:center}.price{font-size:28px;font-weight:800;color:#34d399}
pre{white-space:pre-wrap;background:#0b0f19;border:1px solid #2a3350;padding:14px;border-radius:10px;font-size:14px}
.small{font-size:13px;color:#8a93a8}ol li{margin:6px 0}@media(max-width:640px){.grid{grid-template-columns:1fr}.hero h1{font-size:34px}}
</style></head><body><div class="wrap"><div><b>🛠 FixIt</b> <span class="small">for vibe coders</span></div>{% block body %}{% endblock %}
<p class="small" style="margin-top:40px">We never ask for API keys or passwords. Screenshots are deleted right after analysis. We store only a hashed email for the free-fix counter, plus cases we hand to a human.</p></div></body></html>
