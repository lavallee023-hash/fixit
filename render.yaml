services:
  - type: web
    name: fixit
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --chdir web app:app --bind 0.0.0.0:$PORT --timeout 180 --workers 1 --threads 4
    healthCheckPath: /healthz
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: PAY_LINK_SINGLE
        sync: false
      - key: PAY_LINK_5PACK
        sync: false
      - key: PAY_LINK_MONTHLY
        sync: false
