# To enable: copy to .github/workflows/ (needs a token with workflow scope). Auto-deploy on push: pulls latest code on PythonAnywhere and reloads the web app.
# Needs repo secrets PA_USERNAME and PA_API_TOKEN (PythonAnywhere -> Account -> API token). Skips if unset.
name: deploy-pythonanywhere
on: { push: { branches: [main] }, workflow_dispatch: {} }
jobs:
  deploy:
    runs-on: ubuntu-latest
    env: { PA_USERNAME: "${{ secrets.PA_USERNAME }}", PA_API_TOKEN: "${{ secrets.PA_API_TOKEN }}", PA_HOST: "www.pythonanywhere.com" }
    steps:
      - name: Pull + reload
        if: env.PA_API_TOKEN != ''
        run: |
          set -e
          API="https://$PA_HOST/api/v0/user/$PA_USERNAME"; AUTH="Authorization: Token $PA_API_TOKEN"
          CID=$(curl -sf -X POST -H "$AUTH" -d executable=bash "$API/consoles/" | python3 -c 'import sys,json;print(json.load(sys.stdin)["id"])')
          curl -sf -X POST -H "$AUTH" -H "Content-Type: application/json" -d '{"input":"cd ~/fixit && git pull && pip3.12 install --user -q -r requirements.txt\n"}' "$API/consoles/$CID/send_input/" || echo "console not started yet (open it once in browser)"
          sleep 40
          curl -sf -X POST -H "$AUTH" "$API/webapps/$PA_USERNAME.pythonanywhere.com/reload/"
          curl -s -X DELETE -H "$AUTH" "$API/consoles/$CID/" || true
